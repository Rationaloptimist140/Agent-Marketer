[project]
name = "agent-marketer"
version = "0.1.0"
description = "Autonomous marketing systems: guardrailed rules engines, opportunity finders and decision logging."
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py311"
line-length = 130

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
